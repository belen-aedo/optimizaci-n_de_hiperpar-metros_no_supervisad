paths:
  preprocessor_root: 'C:\Users\belen\Desktop\Taller de investigacion'
  dataset_name: "Ton-IoT"
  selector: "l1_lasso"
  splits_dir: "data/splits"
  outputs_dir: "outputs"

dataset:
  label_col: "category"
  normal_label: "0"
  metadata_cols:
    - "label"
    - "type"
    - "ts"
    - "src_ip"
    - "dst_ip"
    - "src_port"
    - "dst_port"

split:
  seed: 42
  train_frac: 0.70
  val_frac: 0.15
  attack_frac_in_test: 1.0
  oracle_frac_of_test: 0.5
  refit_scaler: true
  report_prevalences: [0.05, 0.10]

threshold:
  q: 0.95
  sensitivity_q: [0.90, 0.95, 0.99]
  calib_frac: 0.5

optimization:
  n_trials: 100
  seeds: [42, 43, 44, 45, 46]
  top_k: 5
  oracle: true
  max_train_rows_lof: 20000
  consistency_boot: 3
  consistency_frac: 0.7

edge:
  max_latency_ms: 100
  max_cpu_percent: 50
  max_ram_mb: 512
  flow_rate_per_s: 100
  latency_stat: "p95"
  dev_slowdown_factor: 5

autoencoder:
  backend: "auto"

search_space:
  iforest_max_samples: "absolute"

detectors:
  iforest: [silhouette, davies_bouldin]
  lof: [silhouette, davies_bouldin]
  autoencoder: [reconstruction, stability]
